# Generated by scripts/export_trino_dev.py from charts/trino. Do not edit.
#
# Edit the chart, or deploy/trino-dev.values.yaml, and regenerate. CI fails if this file
# differs from what the chart renders, so the manifests tier 2 runs against and the chart
# an Operator installs cannot drift apart.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-worker
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/instance: trino
    app.kubernetes.io/version: "483"
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trino
      app.kubernetes.io/instance: trino
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trino
        app.kubernetes.io/instance: trino
        app.kubernetes.io/component: worker
    spec:
      # The group that owns the certificate volume. Without it the 0640 below is root:root
      # and the `trino` user cannot read the keys a connector presents outward.
      securityContext:
        fsGroup: 1000
      containers:
        - name: trino
          image: "trinodb/trino:483"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            # The worker count Apchi's Verification expects comes from this Deployment's
            # ready replicas, so the probe is what decides whether a worker counts.
            exec: {command: ["/usr/lib/trino/bin/health-check"]}
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - {name: config, mountPath: /etc/trino/config.properties, subPath: worker-config.properties}
            - {name: config, mountPath: /etc/trino/node.properties, subPath: node.properties}
            - {name: config, mountPath: /etc/trino/jvm.config, subPath: jvm.config}
            # Workers need the certificates: a connector presenting one to a data source
            # runs here. They need nothing else Apchi writes -- catalogs reach a worker
            # through the coordinator's announcement, and access control, resource groups,
            # event listeners and user mapping are all coordinator-only. That asymmetry is
            # why a catalog or permission change restarts nothing (§7.4).
            - {name: client-certificates, mountPath: /etc/trino/certs, readOnly: true}
      volumes:
        - {name: config, configMap: {name: trino-config}}
        # Private keys, so not world-readable. 0640 with the fsGroup above. §13.2.
        - {name: client-certificates, secret: {secretName: trino-client-certificates, defaultMode: 0640}}
