# Generated by scripts/export_trino_dev.py from charts/apchi. Do not edit.
#
# Edit the chart, or deploy/trino-dev.values.yaml, and regenerate. CI fails if this file
# differs from what the chart renders, so the manifests tier 2 runs against and the chart
# an Operator installs cannot drift apart.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-worker
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/instance: trino
    app.kubernetes.io/version: "483"
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trino
      app.kubernetes.io/instance: trino
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trino
        app.kubernetes.io/instance: trino
        app.kubernetes.io/component: worker
    spec:
      # The group that owns the certificate volume. Without it the 0640 below is root:root
      # and the `trino` user cannot read the keys a connector presents outward.
      securityContext:
        fsGroup: 1000
      # Long enough for the drain below to finish: Trino waits its grace period for the
      # coordinator to notice, lets its tasks finish, and waits the grace period again -- so at
      # least twice it (measured). Killed before then, a worker ends the tasks it was draining.
      terminationGracePeriodSeconds: 30
      containers:
        - name: trino
          image: "trinodb/trino:483"
          imagePullPolicy: IfNotPresent
          # Sizing, on the pod beside the memory limit it has to fit. See the coordinator.
          env:
            - name: JDK_JAVA_OPTIONS
              value: "-Xmx2G -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:-OmitStackTraceInFastThrow"
            - name: TRINO_QUERY_MAX_MEMORY_PER_NODE
              value: "600MB"
            - name: TRINO_MEMORY_HEAP_HEADROOM_PER_NODE
              value: "600MB"
          ports:
            - containerPort: 8080
              name: http
          lifecycle:
            # Drain before Kubernetes stops the container: a worker told to shut down stops
            # taking tasks, finishes the ones it has, and exits by itself. The hook waits for
            # that, because SIGTERM follows the moment it returns, and SIGTERM ends the drain.
            # Apchi's identity asks, and the worker's own rules -- rendered by Apchi -- allow
            # that one identity to and nobody else (measured: 403 for anyone else, and for
            # every identity on a worker with no rules at all).
            #
            # A worker that is not serving yet has nothing to drain, so a refused request ends
            # the hook rather than waiting out the grace period for nothing.
            #
            # Kubernetes records FailedPreStopHook for every drain that finishes: the worker
            # exits while the hook is still waiting on it, and that is how a completed drain
            # ends -- measured on kind, the event lands exactly twice the grace period after
            # the pod was deleted.
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - >-
                    curl -sf -X PUT -d '"SHUTTING_DOWN"' -H 'Content-Type: application/json'
                    -H 'X-Trino-User: apchi'
                    http://localhost:8080/v1/info/state || exit 0;
                    while kill -0 1 2>/dev/null; do sleep 1; done
          startupProbe:
            exec: {command: ["/usr/lib/trino/bin/health-check"]}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec: {command: ["/usr/lib/trino/bin/health-check"]}
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 8
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
            runAsUser: 1000
          readinessProbe:
            # The worker count Apchi's Verification expects comes from this Deployment's
            # ready replicas, so the probe is what decides whether a worker counts.
            exec: {command: ["/usr/lib/trino/bin/health-check"]}
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            # Trino's own files, which Apchi renders into its Secret and this chart only
            # mounts (ADR-0010) -- the drain rule above among them. subPath and fixed, as on
            # the coordinator: each needs a restart to take effect, and Apchi restarts the
            # workers only when one of theirs changed.
            - {name: server-config, mountPath: /etc/trino/config.properties, subPath: config.properties}
            - {name: server-config, mountPath: /etc/trino/node.properties, subPath: node.properties}
            - {name: server-config, mountPath: /etc/trino/jvm.config, subPath: jvm.config}
            - {name: server-config, mountPath: /etc/trino/log.properties, subPath: log.properties}
            - {name: server-config, mountPath: /etc/trino/access-control.properties, subPath: access-control.properties}
            - {name: server-config, mountPath: /etc/trino/worker-rules.json, subPath: worker-rules.json}
            # Workers need the certificates: a connector presenting one to a data source
            # runs here. They need nothing else Apchi writes -- catalogs reach a worker
            # through the coordinator's announcement, and access control, resource groups,
            # event listeners and user mapping are all coordinator-only. That asymmetry is
            # why a catalog or permission change restarts nothing (§7.4).
            - {name: client-certificates, mountPath: /etc/trino/certs, readOnly: true}
            # node.data-dir, writable by whatever uid the pod is given. See the coordinator.
            - {name: data, mountPath: /data/trino}
      volumes:
        # The Admin's properties can be credentials, so 0640 with the fsGroup above. §13.2.
        - {name: server-config, secret: {secretName: trino-server-config-worker, defaultMode: 0640}}
        # Private keys, so not world-readable. 0640 with the fsGroup above. §13.2.
        - {name: client-certificates, secret: {secretName: trino-client-certificates, defaultMode: 0640}}
        - {name: data, emptyDir: {}}
---
# How many workers a voluntary disruption -- a node drain, a cluster upgrade -- may take at
# once. Each worker evicted drains first (its preStop hook), so a budget turns a node drain
# into workers finishing their tasks one at a time, rather than every worker on the node
# ending its tasks together.
#
# Workers only. The coordinator is one pod that cannot drain (ADR-0003): a budget there would
# either allow its eviction, which protects nothing, or forbid it, which blocks every node drain
# until somebody deletes the budget.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trino-worker
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/instance: trino
    app.kubernetes.io/version: "483"
    app.kubernetes.io/component: worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: trino
      app.kubernetes.io/instance: trino
      app.kubernetes.io/component: worker
  maxUnavailable: 1
