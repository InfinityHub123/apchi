apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
data:
  # catalog.store selects the store; it belongs HERE, not in catalog-store.properties.
  # The insecure variant, because this dev cluster has no TLS. It is the same file and
  # the same parser as the certificate variant an Operator configures in production --
  # Trino rejects `...certificate.user-mapping.file` unless certificate authentication is
  # on, so the property differs and nothing else does. See §7.6.
  coordinator-config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=false
    http-server.http.port=8080
    discovery.uri=http://trino:8080
    catalog.management=dynamic
    catalog.store=file
    http-server.authentication.insecure.user-mapping.file=/etc/trino/user-mapping.json
  worker-config.properties: |
    coordinator=false
    http-server.http.port=8080
    discovery.uri=http://trino:8080
    catalog.management=dynamic
  node.properties: |
    node.environment=apchidev
  jvm.config: |
    -server
    -Xmx2G
    -XX:+UseG1GC
    -XX:+ExitOnOutOfMemoryError
    -XX:-OmitStackTraceInFastThrow
    -Djdk.attach.allowAttachSelf=true
  # Read as etc/catalog-store.properties, relative to CWD /data/trino,
  # whose etc symlinks to /etc/trino. Takes only catalog.config-dir and
  # catalog.read-only -- catalog.store is rejected here.
  catalog-store.properties: |
    catalog.config-dir=/data/trino/catalogs
  # refresh-period is what makes the whole-volume mount worth anything: without it
  # Trino reads the rules once at startup and a Secret the kubelet faithfully keeps
  # current is never re-read. The two delays add -- kubelet syncFrequency, then this.
  access-control.properties: |
    access-control.name=file
    security.config-file=/etc/trino/access-control/rules.json
    security.refresh-period=1s
---
apiVersion: v1
kind: Secret
metadata:
  name: trino-catalog-seed
stringData:
  # Apchi patches this Secret. It is the durable record; the store
  # directory in the pod is the live working copy, reseeded at every start.
  tpch.properties: |
    connector.name=tpch
---
apiVersion: v1
kind: Secret
metadata:
  name: trino-client-certificates
# Apchi fills this; the Admin mounts it, on the coordinator and on the workers. One Secret
# for every certificate, mounted once at a fixed directory, so uploading one adds a file to
# a mount that already exists -- no pod spec change and no restart. See ADR-0005.
stringData: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: trino-resource-groups
# Apchi writes both files it holds -- the rules and the resource-groups.properties that
# points at them -- and mounts them on the coordinator when a group or selector is
# configured. It starts empty and carries no mount: the properties file is what turns the
# feature on, so "no Resource Groups" is the absence of both.
stringData: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: trino-event-listener
# Apchi writes this, and mounts it on the coordinator itself when an Event Listener is
# configured. It starts empty and carries no mount: Trino refuses to start if a listener
# file it was told to read is missing, so "no Event Listener" is expressed by the absence
# of the mount -- which is why Apchi owns that one volume on the pod template.
stringData: {}
