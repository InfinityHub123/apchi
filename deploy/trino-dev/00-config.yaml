apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
data:
  # catalog.store selects the store; it belongs HERE, not in catalog-store.properties.
  coordinator-config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=false
    http-server.http.port=8080
    discovery.uri=http://trino:8080
    catalog.management=dynamic
    catalog.store=file
  worker-config.properties: |
    coordinator=false
    http-server.http.port=8080
    discovery.uri=http://trino:8080
    catalog.management=dynamic
  node.properties: |
    node.environment=apchidev
  jvm.config: |
    -server
    -Xmx2G
    -XX:+UseG1GC
    -XX:+ExitOnOutOfMemoryError
    -XX:-OmitStackTraceInFastThrow
    -Djdk.attach.allowAttachSelf=true
  # Read as etc/catalog-store.properties, relative to CWD /data/trino,
  # whose etc symlinks to /etc/trino. Takes only catalog.config-dir and
  # catalog.read-only -- catalog.store is rejected here.
  catalog-store.properties: |
    catalog.config-dir=/data/trino/catalogs
  access-control.properties: |
    access-control.name=file
    security.config-file=/etc/trino/access-control/rules.json
---
apiVersion: v1
kind: Secret
metadata:
  name: trino-catalog-seed
stringData:
  # Apchi patches this Secret. It is the durable record; the store
  # directory in the pod is the live working copy, reseeded at every start.
  tpch.properties: |
    connector.name=tpch
---
apiVersion: v1
kind: Secret
metadata:
  name: trino-access-control
stringData:
  # Generated by Apchi. The owner mode is what gates CREATE/DROP CATALOG.
  # The catch-all rule is mandatory: without it every user is denied
  # access to every catalog.
  rules.json: |
    {
      "catalogs": [
        {"user": "apchi", "allow": "owner"},
        {"allow": "all"}
      ]
    }
