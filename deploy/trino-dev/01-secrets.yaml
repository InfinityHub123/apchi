# Hand-written, and the one file here that is. Not generated, because there is no chart to
# generate it from: `charts/trino` creates no Secrets at all.
#
# These hold configuration Apchi writes, so Apchi's chart creates them -- which is why Apchi
# is installed before Trino. Tier 2 does not install Apchi's chart, so the fixture needs its
# own copies, and these are them. Two more live beside them in 05-access-control.yaml and
# 06-user-mapping.yaml, generated from Apchi's own generators because Trino reads both while
# loading and refuses to boot if either is missing.
#
# Nothing here can drift unnoticed: the generated Deployments mount every one of these by
# name, so a disagreement stops the coordinator from starting rather than passing quietly.
apiVersion: v1
kind: Secret
metadata:
  name: trino-catalog-seed
stringData:
  # Apchi patches this Secret. It is the durable record; the store directory in the pod is
  # the live working copy, reseeded from here by an initContainer at every start.
  #
  # `tpch` is here so the Cluster comes up with something queryable before Apchi has ever
  # applied. Note what that means and what tier 2 asserts about it: a catalog in this Secret
  # that Apchi does not hold in a Snapshot disappears at the first Apply that rewrites the
  # seed, which is §10's divergence seen from the other side.
  tpch.properties: |
    connector.name=tpch
---
apiVersion: v1
kind: Secret
metadata:
  name: trino-client-certificates
# Apchi fills this; the Admin mounts it, on the coordinator and on the workers. One Secret
# for every certificate, mounted once at a fixed directory, so uploading one adds a file to
# a mount that already exists -- no pod spec change and no restart. See ADR-0005.
stringData: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: trino-resource-groups
# Apchi writes both files it holds -- the rules and the resource-groups.properties that
# points at them -- and mounts them on the coordinator when a group or selector is
# configured. It starts empty and carries no mount: the properties file is what turns the
# feature on, so "no Resource Groups" is the absence of both.
stringData: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: trino-event-listener
# Apchi writes this, and mounts it on the coordinator itself when an Event Listener is
# configured. It starts empty and carries no mount: Trino refuses to start if a listener
# file it was told to read is missing, so "no Event Listener" is expressed by the absence
# of the mount -- which is why Apchi owns that one volume on the pod template.
stringData: {}
