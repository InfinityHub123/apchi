# OpenShift's restricted-v2 SCC, as far as Apchi's pods meet it, emulated on any Kubernetes
# with two built-in admission policies. CI applies this to the tier 2 kind cluster, because
# kind and minikube enforce none of it -- which is how a chart pinning fsGroup and a
# Validation pod nobody could admit both reached a real OpenShift before anything noticed.
#
# Scoped to the pods Apchi itself is responsible for: its API pod and the Validation pods it
# creates. Trino's own pods are the Admin's, and the chart's bundled MongoDB is for trying
# Apchi out, not for a restricted cluster.
#
# Conservative where OpenShift is not fully known. The uid is arbitrary and so is the group
# -- not 0 -- so a file that is only group-readable stays unreadable, which is what a real
# restricted-v2 install reported. Not emulated: SELinux labels and CRI-O.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: restricted-v2-arbitrary-uid
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: apchis-pods
      expression: >-
        'apchi.dev/role' in object.metadata.?labels.orValue({}) ||
        object.metadata.?labels.orValue({})[?'app.kubernetes.io/component'].orValue('') == 'api' &&
        object.metadata.?labels.orValue({})[?'app.kubernetes.io/name'].orValue('') == 'apchi'
  failurePolicy: Fail
  reinvocationPolicy: Never
  # What the SCC does to every pod: a uid from the namespace's range, whatever the pod or
  # the image asked for.
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              securityContext: Object.spec.securityContext{
                runAsUser: 1000680000,
                runAsGroup: 1000680000
              }
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: restricted-v2-arbitrary-uid
spec:
  policyName: restricted-v2-arbitrary-uid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restricted-v2
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: apchis-pods
      expression: >-
        'apchi.dev/role' in object.metadata.?labels.orValue({}) ||
        object.metadata.?labels.orValue({})[?'app.kubernetes.io/component'].orValue('') == 'api' &&
        object.metadata.?labels.orValue({})[?'app.kubernetes.io/name'].orValue('') == 'apchi'
  failurePolicy: Fail
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: "!object.spec.?securityContext.?fsGroup.hasValue()"
      message: restricted-v2 assigns fsGroup itself, and refuses a pod that pins one
    # The pod-level uid is the one the mutation above assigned. A container-level one
    # would override it, which the SCC does not allow.
    - expression: variables.containers.all(c, !c.?securityContext.?runAsUser.hasValue())
      message: restricted-v2 assigns the uid itself; no container may set runAsUser
    - expression: >-
        object.spec.?securityContext.?runAsNonRoot.orValue(false) ||
        variables.containers.all(c, c.?securityContext.?runAsNonRoot.orValue(false))
      message: runAsNonRoot must be true
    - expression: >-
        object.spec.?securityContext.?seccompProfile.?type.orValue('') == 'RuntimeDefault' ||
        variables.containers.all(c, c.?securityContext.?seccompProfile.?type.orValue('') == 'RuntimeDefault')
      message: the seccomp profile must be RuntimeDefault
    - expression: >-
        variables.containers.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
      message: every container must set allowPrivilegeEscalation false
    - expression: >-
        variables.containers.all(c, 'ALL' in c.?securityContext.?capabilities.?drop.orValue([]))
      message: every container must drop ALL capabilities
    # Not restricted-v2 at all, but the resource policy some fleets add to it, and the one
    # a real install hit: requests and limits on every container, memory's equal.
    - expression: >-
        variables.containers.all(c,
          ['cpu', 'memory'].all(r,
            r in c.?resources.?requests.orValue({}) && r in c.?resources.?limits.orValue({})) &&
          c.resources.requests['memory'] == c.resources.limits['memory'])
      message: every container must set cpu and memory requests and limits, memory's equal
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restricted-v2
spec:
  policyName: restricted-v2
  validationActions: [Deny]
