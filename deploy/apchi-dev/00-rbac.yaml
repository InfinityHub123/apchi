apiVersion: v1
kind: ServiceAccount
metadata:
  name: apchi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: apchi
rules:
  # The Secrets Apchi generates configuration into, and the ephemeral Secret a
  # Validation mounts on its probe. `list` is how a crashed Apchi finds the
  # Secrets a previous Validation leaked.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, patch, delete]
  # Read-only: a precondition check reads the ConfigMap behind whatever the Admin
  # mounted at access-control.properties. Apchi never writes a ConfigMap.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  # The ephemeral validation coordinator. Apchi creates one, reads its phase and
  # its log, and deletes it.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # A Rollout patches the coordinator Deployment and then watches its status.
  # Apchi never creates or deletes a Deployment.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apchi
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: apchi}
subjects:
  - {kind: ServiceAccount, name: apchi}
