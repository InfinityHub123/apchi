# Apchi configures ONE Trino cluster, and it has to run in that cluster's namespace:
# a Validation reaches its ephemeral coordinator by pod IP, and it reads and writes
# the Secrets the coordinator mounts. Install it where Trino already is.

image:
  repository: ghcr.io/infinityhub123/apchi
  # Empty means the chart's appVersion, so an install gets the image the chart was
  # released with rather than whatever `latest` happens to be today.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# One replica, and Recreate rather than RollingUpdate. An Apply is in-process state --
# the runner holds the task and the Candidate lock -- so a second Apchi would run a
# second pipeline against one Trino. This is not a value you want to raise.
replicaCount: 1

# How a caller proves who they are (section 19).
#
#   none      every request is treated as an Admin. This is the default because it is
#             what Apchi has always done -- every endpoint open -- and changing it on
#             upgrade would lock an existing install out of its own Admin surface.
#   password  a username and password, against users Apchi stores. Not built yet.
#   sso       OIDC against your identity provider. Not built yet.
#
# `none` means anyone who can reach the pod can disable permission enforcement across
# the cluster. Reach it only through something that authenticates, or set a real mode
# once one exists.
auth:
  mode: none
  # The one Admin a new install starts with, in password mode. Applied only when Apchi's
  # user collection is empty, so it can never resurrect a deleted account or reset a
  # changed password on a restart.
  #
  # A password *hash*, never the password: values end up in the release, in `helm get
  # values` and often in a git repository. Generate one with
  #
  #   python -c 'from argon2 import PasswordHasher as P; print(P().hash("your password"))'
  #
  # The hash is still worth protecting -- it is offline-crackable -- so point
  # existingSecret at a Secret you manage instead of putting it here.
  initialAdmin:
    username: admin
    passwordHash: ""
    # A Secret holding the hash, used in preference to passwordHash above.
    existingSecret: ""
    existingSecretKey: password-hash
  # How long an untouched browser session lasts. Sessions are rows in MongoDB, so a
  # logout or a disabled account takes effect at once rather than when this elapses.
  sessionHours: 12
  # sso mode: Apchi as an OpenID Connect client against your identity provider. Apchi is
  # never an identity provider itself, so this works against Keycloak, Authentik, Zitadel,
  # Okta or Entra without Apchi knowing which.
  oidc:
    # Every endpoint Apchi uses is discovered from here. Not six configured endpoints: a
    # provider that rotates its keys or moves an endpoint keeps working, and a mistyped
    # endpoint would fail during the one login somebody needed.
    issuer: ""
    clientId: ""
    # Put the secret in a Secret you manage. clientSecret below exists for a quick trial and
    # puts it in the release, in `helm get values`, and usually in a git repository.
    clientSecret: ""
    existingSecret: ""
    existingSecretKey: client-secret
    # Where the provider sends the browser back, and the one value nothing can guess for
    # you: it must be the URL a *browser* reaches Apchi on, through whatever Ingress or
    # port-forward is in front of it, and it must be registered with the provider verbatim.
    #
    # A wrong one is a login loop with no error anywhere -- the provider refuses a redirect
    # URI it does not recognise, and the browser never gets as far as Apchi. Set it, or set
    # expose.apchi.host and it becomes https://<host>/api/v1/auth/sso/callback.
    redirectUrl: ""
    # `groups` is not a standard OIDC scope, and providers disagree about whether one is
    # needed to emit group membership at all: Dex and Keycloak want it, Entra puts roles in
    # the token without it. Trim this if your provider rejects a scope it does not know.
    scopes: "openid profile email groups"
    # Which claim is the person's Apchi username. `sub` is the only claim OIDC guarantees is
    # stable, but it is routinely an opaque blob, and the audit trail records an actor
    # somebody has to be able to read.
    #
    # The consequence, because it is not recoverable afterwards: this value *is* the Apchi
    # username, so a provider that changes somebody's login name produces a new Apchi user.
    # Any tokens they minted stay with the old name for an Admin to revoke.
    usernameClaim: preferred_username
    # Which claim carries group membership, and which of its values mean Admin. Comma
    # separated. Everyone who authenticates is an Operator; only a member of one of these
    # groups is an Admin.
    #
    # Leaving adminGroups empty means nobody is an Admin -- which closes /admin/* to
    # everybody rather than opening it to everybody. That is the safe direction, but it does
    # mean nobody can inject low-level configuration or release Maintenance Mode.
    roleClaim: groups
    adminGroups: ""

# §20's audit history: who changed what, and when. Always on -- it is the only record of
# which operator staged which change into the shared Configuration Candidate, and the only
# record of an admin change at all, since those never appear in a Snapshot.
audit:
  # How long to keep it. Empty means forever, and that is the default deliberately: an audit
  # trail that silently deletes itself is worse than one that grows, because the first thing
  # an incident asks is what happened before the window you kept.
  #
  # Setting this creates a TTL index on the collection, so history older than it is discarded
  # by MongoDB without further warning. Choose it on purpose.
  retentionDays: ""

# The most the configuration candidate may occupy. It is one MongoDB document by design,
# and MongoDB caps a document at 16MB -- so this is a ceiling on everything staged across all
# six sections together, not a quota per section.
#
# Below 16MB deliberately: BSON overhead means the serialised size is not the document size,
# and there has to be room for the snapshot an apply makes of the same content. Raise it only
# if you know what the overhead is for your data; an edit that crosses it is refused with
# `candidate_too_large` naming the section that grew.
candidateMaxBytes: 15728640

service:
  type: ClusterIP
  port: 8000

# Apchi and Trino reached from outside the cluster: a Route on OpenShift, an Ingress anywhere
# else. Each is created only when its host is set, and there is no default host.
expose:
  # auto creates a Route where the API serves route.openshift.io/v1 and an Ingress
  # otherwise. Only `helm install` and `helm upgrade` can ask: `helm template`, Argo CD and
  # other renderers see no cluster, so they would always get an Ingress. Set route or
  # ingress there.
  kind: auto  # auto | route | ingress
  ingress:
    className: ""
    # Ingress has no field for passthrough or reencrypt, so each controller takes its own
    # annotation. Named here, the chart adds it; any other controller takes it through the
    # exposure's `annotations`.
    controller: ""  # nginx | haproxy | ""
  apchi:
    host: ""
    # edge only: Apchi serves plain HTTP, so there is no TLS for a router to pass through.
    termination: edge
    # Ingress with edge: the Secret holding the certificate the controller presents. Empty
    # uses the controller's default certificate. A Route uses the router's.
    tlsSecret: ""
    annotations: {}
  trino:
    host: ""
    # edge | passthrough | reencrypt. passthrough and reencrypt need trino.https. Behind
    # edge or reencrypt Trino is told to trust X-Forwarded-Proto, or it sees plain HTTP from
    # the router and refuses password and OAuth authentication.
    termination: edge
    tlsSecret: ""
    # A Route with reencrypt: the CA that signed Trino's server certificate, in PEM. Empty
    # takes caBundle from the cluster at install time, and failing that the router's
    # service CA. Argo CD renders without reading the cluster, so set it there.
    destinationCACertificate: ""
    annotations: {}

serviceAccount:
  create: true
  # Defaults to the release name.
  name: ""
  annotations: {}

# The Role grants only what Apchi calls: see templates/rbac.yaml, which says why for
# each verb. Set create: false to bind your own.
rbac:
  create: true

logging:
  # INFO and console lines when null. An explicit value can be raised during an incident
  # without a rebuild.
  level: null
  json: null
  # Debugging mode: DEBUG unless level says otherwise, every line naming the code it came
  # from, and each call Apchi makes to Kubernetes, Trino and MongoDB logged by name and
  # timing. Never a payload, so it is safe in production; Apchi logs a warning while it is on.
  debug: false

trino:
  # The identity Apchi issues DDL as, and the only identity granted `owner` on
  # catalogs -- which is what restricts catalog DDL to Apchi.
  user: apchi
  # Where Trino keeps its dynamic catalog store. Nothing read-only may be mounted here
  # or above it, or every CREATE CATALOG fails.
  catalogStoreDir: /data/trino/catalogs
  # The catalog the Verification smoke query runs against.
  verificationCatalog: system

  # The cluster this chart runs. Its Deployments are `<name>-coordinator` and `<name>-worker`,
  # its Service `<name>`, and Apchi is configured with exactly those -- one value, so they
  # cannot disagree. Validation reads the coordinator's image, so the ephemeral coordinator
  # is always the version the Cluster runs.
  name: trino

  image:
    repository: trinodb/trino
    # Apchi is developed and tested against 483. Several behaviours it relies on were
    # established by reading that version rather than its documentation.
    tag: "483"
    pullPolicy: IfNotPresent
  coordinator:
    # Trino cannot drain a coordinator, so there is exactly one and a Rollout destroys every
    # running query. That is a property of Trino, not a limit of this chart (ADR-0003).
    resources: {}
    # Sizing, which is this chart's and not Apchi's, because it has to fit the memory limit
    # in resources: the heap and every JVM flag go into JDK_JAVA_OPTIONS, and query memory
    # into the variables Apchi's config.properties refers to. The render fails when the heap
    # exceeds resources.limits.memory, or when maxMemoryPerNode + heapHeadroomPerNode exceeds
    # the heap -- Trino refuses that at startup anyway. Leave room outside the heap: the JVM
    # needs some for itself, so a heap near the limit is an OOM kill under load.
    jvm:
      maxHeapSize: 2G   # -Xmx units: k, m, g
      # After the chart's defaults (G1, exit on OOM), so a flag here wins over them.
      extraArgs: []
    memory:
      # Trino's DataSize units: MB, GB. The whole Cluster's ceiling for one query.
      queryMaxMemory: 20GB
      # The coordinator schedules no tasks (node-scheduler.include-coordinator=false), but
      # Trino still checks these two against its heap at startup.
      maxMemoryPerNode: 600MB
      heapHeadroomPerNode: 600MB
    # The initContainer that seeds the catalog store, which copies a few files. Its own value
    # because a fleet requiring limits on every container refuses the pod without them, and
    # it needs a fraction of what Trino does. Empty sets none.
    seedResources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAnnotations: {}
    # Trino's own health-check script. It is what makes a Rollout's "complete" mean the
    # coordinator is answering, which Apchi's Verification depends on.
    # Startup covers the boot, then liveness takes over: Trino's own health-check, failing for
    # failureThreshold x periodSeconds before the pod is restarted. Loose by design -- a
    # coordinator restart ends every query, so it must take a Trino that has stopped
    # answering, not one in a long GC pause.
    startupProbe:
      periodSeconds: 5
      failureThreshold: 60
    livenessProbe:
      enabled: true
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 8
    readinessProbe:
      initialDelaySeconds: 15
      periodSeconds: 5
      failureThreshold: 30

  worker:
    replicas: 2
    resources: {}
    # A worker drains before it stops: it finishes its running tasks, so replacing one costs
    # no query. Trino waits this long for the coordinator to notice, before and after the
    # tasks finish, and Apchi renders it as the worker's shutdown.grace-period.
    gracefulShutdown:
      gracePeriodSeconds: 120
    # At least twice the grace period, plus the longest task you want a drain to wait for.
    # The render fails below twice it.
    terminationGracePeriodSeconds: 600
    # How many workers a node drain or a cluster upgrade may take at once. Each drains first,
    # so the default lets a drain proceed one worker at a time without ending their tasks.
    # Set minAvailable instead, not both. Workers only: a budget on the single coordinator
    # would either protect nothing or block every node drain.
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    # Sizing, which is this chart's and not Apchi's, because it has to fit the memory limit
    # in resources: the heap and every JVM flag go into JDK_JAVA_OPTIONS, and query memory
    # into the variables Apchi's config.properties refers to. The render fails when the heap
    # exceeds resources.limits.memory, or when maxMemoryPerNode + heapHeadroomPerNode exceeds
    # the heap -- Trino refuses that at startup anyway. Leave room outside the heap: the JVM
    # needs some for itself, so a heap near the limit is an OOM kill under load.
    jvm:
      maxHeapSize: 2G   # -Xmx units: k, m, g
      # After the chart's defaults (G1, exit on OOM), so a flag here wins over them.
      extraArgs: []
    memory:
      maxMemoryPerNode: 600MB
      heapHeadroomPerNode: 600MB
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAnnotations: {}
    # Startup covers the boot, then liveness takes over: Trino's own health-check, failing for
    # failureThreshold x periodSeconds before the pod is restarted. Loose by design -- a
    # coordinator restart ends every query, so it must take a Trino that has stopped
    # answering, not one in a long GC pause.
    startupProbe:
      periodSeconds: 5
      failureThreshold: 60
    livenessProbe:
      enabled: true
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 8
    readinessProbe:
      initialDelaySeconds: 15
      periodSeconds: 5
      failureThreshold: 30

  service:
    type: ClusterIP
    port: 8080

  # node.environment. Lowercase alphanumeric and underscores only; Trino rejects the rest.
  environment: production
  httpPort: 8080

  # How clients outside the namespace reach Trino, and the one switch for how callers sign in.
  # No Admin input can move a Cluster from one to the other.
  #
  # `enabled: true`, the default: the coordinator serves HTTPS, and HTTPS always authenticates
  # -- CERTIFICATE unless an Admin sets other methods in the coordinator's Server Configuration
  # (`http-server.authentication.type`: PASSWORD, OAUTH2, a list). Plain HTTP stays on httpPort
  # beside it and takes the user name a client sends; the NetworkPolicy keeps it to the pods in
  # this namespace -- Apchi, which so needs no certificate, the workers, a metrics scraper. A
  # Route or Ingress for Trino has to reach HTTPS: passthrough or reencrypt, never edge.
  #
  # `enabled: false`: plain HTTP alone, and the user name a client sends is who it is. For the
  # quickstart and development, never for a Cluster anyone else can reach.
  #
  # existingSecret is yours to provide: Apchi does not issue certificates. It holds the server
  # certificate and its key apart, the way cert-manager writes them, for the name clients
  # reach Trino by. Trino reads a PEM keystore only as one file holding both, so an
  # initContainer joins them at pod start into a volume only this pod can read.
  https:
    enabled: true
    port: 8443
    existingSecret: ""
    certificateKey: tls.crt
    keyKey: tls.key
    # The CA a client certificate has to be issued by, for the CERTIFICATE method. Mounted
    # whatever the methods are, because the chart cannot know which an Admin will choose.
    # cert-manager writes the issuer's CA into the same Secret as ca.crt.
    clientCaKey: ca.crt

  # How often Trino re-reads the access-control rules. Not optional: without it the rules
  # are read once at startup, and Apchi would report a permission change the Cluster never
  # sees. Apchi refuses to Apply against a Cluster that does not set it.
  securityRefreshPeriod: 30s

  # The group every pod runs with, and the group that owns the files on Apchi's Secret
  # volumes. It must be the `trino` user's group in the image -- gid 1000 in `trinodb/trino`
  # -- and it is not decoration: a credential volume's `defaultMode` of 0640 makes the file
  # root-owned and group-readable, so without the group Trino cannot read its own private
  # keys at all.
  #
  # Both halves are needed and neither is sufficient. Measured on a real cluster with a
  # readOnly secret mount:
  #
  #   neither                      0644 root:root   world-readable
  #   fsGroup only                 0644 root:trino  world-readable
  #   defaultMode 0640 + fsGroup   0640 root:trino  what we want
  #
  # 0600 is not reachable here, and asking for it is not an error: the kubelet ORs
  # roMask = 0440 into every file's mode on a readOnly volume, so 0600 arrives as 0640.
  # That is also exactly what libpq accepts for a root-owned key file, and what it refuses
  # a world-readable one for. See §13.2.
  #
  # On OpenShift's restricted-v2 it has to be a group the namespace allows -- the first of
  # its `openshift.io/sa.scc.supplemental-groups` annotation -- or the pod is refused; 1000
  # is far below any range OpenShift allocates. null renders none and lets the platform
  # choose, which Apchi accepts only with `restrictedPodSecurity`, because a 0640 credential
  # is then unreadable and has to be 0644.
  fsGroup: 1000

  # The uid the image's `trino` user has. Stated because the image names its user rather than
  # numbering it, and with runAsNonRoot -- which every container here sets, for Kubernetes'
  # restricted Pod Security level -- the kubelet refuses a named user it cannot verify. Ignored
  # under restrictedPodSecurity, where the platform assigns the uid.
  runAsUser: 1000


# Set on a cluster that forbids pinning fsGroup and assigns each pod an arbitrary uid:
# OpenShift's restricted-v2 SCC. Three things change, all because a mounted file can then
# reach the process only by being world-readable:
#
# - Apchi's own pod renders no fsGroup and mounts its credentials 0644, ignoring
#   pod.fsGroup and pod.credentialFileMode.
# - The Validation pod Apchi creates carries no fsGroup either, and gets a writable
#   /data/trino. Give it limits under validation.resources if your cluster requires them.
# - Apchi accepts 0644 credential mounts on the Trino pods, where it otherwise refuses
#   anything looser than 0640 with an fsGroup. It still refuses a writable one.
#
# The rest of restricted-v2's security context -- runAsNonRoot, the seccomp profile, the
# dropped capabilities, the uid -- the platform adds to every pod itself, and the image runs
# as any uid. This setting only decides fsGroup and file modes.
restrictedPodSecurity: false

# Who may reach Trino's pods. On by default, because with trino.https.enabled it is what keeps the coordinator's HTTP port -- which trusts the user name a client sends, and is
# how Apchi reaches Trino -- to the pods in Trino's namespace. Everyone outside it uses the
# HTTPS port, which is open to all because it authenticates them.
#
# Without trino.https.enabled there is no HTTPS to send anyone to, so the HTTP port also
# admits the router or ingress controller when expose.trino is set, and the
# peers listed below. Egress is never restricted -- Trino reaches databases, object stores and
# DNS the chart cannot enumerate.
#
# Your cluster's network plugin must enforce NetworkPolicy, or this renders and protects
# nothing; kind's default plugin does not. Turning it off leaves the HTTP port to any pod that
# can route to it, as any user. Every pod in this namespace is admitted to both roles, so a
# scraper here, such as Alloy, needs nothing listed.
networkPolicy:
  enabled: true
  # Without trino.https.enabled: extra NetworkPolicyPeers outside this namespace allowed to
  # the coordinator, e.g.
  #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: trino-gateway}}
  coordinator:
    from: []
  # And to the workers' HTTP port, in either mode -- a scraper in another namespace, say.
  worker:
    from: []
  # Where the ingress controller runs, when Trino is exposed by an Ingress without
  # trino.https.enabled. Required then; a Route needs nothing, OpenShift's router namespace is
  # selected by its own labels.
  ingressControllerNamespaceSelector: {}

# The certificate authorities every pod trusts, mounted into each one the same way. Both are
# optional and render nothing when unset, and both are named rather than looked up: Helm's
# `lookup` finds nothing under `helm template`, `--dry-run` or Argo CD, so the same values
# would render a different pod depending on how the chart was installed.
#
# A PEM bundle, in every pod -- Apchi, MongoDB, the Trino coordinator and workers, and the
# Validation pod Apchi creates -- at /etc/pki/tls/certs/ca-bundle.crt, the path RHEL-based
# images read their system trust from. That **replaces** an image's own bundle there, so it
# has to hold the public roots too if anything should still trust them; OpenShift's injected
# bundle does. Apchi itself adds it to the public store rather than replacing it, for every
# connection it makes: Trino, MongoDB, the OIDC provider and the alert webhook.
#
# On OpenShift it is a ConfigMap labelled `config.openshift.io/inject-trusted-cabundle: "true"`,
# which the platform fills under the key `ca-bundle.crt`. A list of public certificates, so it
# is mounted unrestricted and needs no fsGroup.
caBundle:
  existingSecret: ""
  configMap: ""
  key: ca-bundle.crt

# A Java truststore, in every pod that runs Trino: the coordinator, the workers and the
# Validation pod. Mounted at /etc/pki/java/truststore/cacerts, and Trino's JVM is pointed at it
# with -Djavax.net.ssl.trustStore -- nothing else to set. It then trusts what is in this store
# **instead of** the JDK's own, so include the public roots if a catalog reaches anything they
# sign. This is what connectors use for their outbound TLS; Trino's own HTTPS server checks
# client certificates against trino.https.clientCaKey instead.
javaTruststore:
  existingSecret: ""
  configMap: ""
  key: cacerts
  # Only for a store that needs one to load. Java reads the certificates in a truststore
  # without its password, so most do not.
  password:
    existingSecret: ""
    key: ""

# What Apchi's own pod runs as, and how it mounts its own credentials: `mongodb.tls`. A
# Secret volume's files are root-owned whatever their mode, so the group has to be one
# Apchi's process belongs to.
pod:
  # uid 10001, gid 10001, from the image's `useradd` -- read out of the built image rather
  # than assumed, because Debian's useradd is free to pick a different gid and a mismatch
  # here is a key the process cannot read.
  fsGroup: 10001
  # 0640 and not 0600: the kubelet ORs 0440 into every file's mode in a readOnly volume, so
  # 0600 cannot be produced. 0644 would leave a private key world-readable.
  credentialFileMode: 0640

mongodb:
  # Apchi's own storage: every Snapshot and all in-flight state.
  #
  # With `tls` below set this may carry `?authMechanism=MONGODB-X509`, which is worth
  # preferring where MongoDB offers it: the URI then holds no secret at all, where a SCRAM
  # password in it sits in `helm get values` and in the pod spec.
  uri: ""
  database: apchi
  # Reaching a MongoDB that requires TLS, and authenticating to it with a certificate.
  tls:
    # A Secret holding the PEM files below, mounted read-only at mountPath.
    existingSecret: ""
    # The Secret key holding one PEM with Apchi's certificate **and its key** -- hence the
    # doubled word, not a typo: the `...Key` suffix names a Secret key, as above, and the
    # file itself is PyMongo's `tlsCertificateKeyFile`.
    #
    # A client certificate turns TLS on by itself. Without one, put tls=true in the URI: the
    # CA bundle alone does not, because it is what every pod trusts.
    certificateKeyKey: ""
    # Or the certificate and its key as two keys of the same Secret, which is how most
    # issuers write them (`tls.crt` and `tls.key` from cert-manager). Apchi joins the two
    # itself as it starts, so nothing has to concatenate them first. Both or neither, and
    # not alongside certificateKeyKey.
    certificateKey: ""
    keyKey: ""
    mountPath: /etc/apchi/mongo-tls
  # true deploys a single-replica MongoDB on an emptyDir alongside Apchi, for trying
  # Apchi out. It loses every Snapshot when its pod restarts. Point `uri` at a real
  # MongoDB for anything else.
  deploy: false
  image: mongo:7
  resources:
    requests:
      memory: 256Mi
      cpu: 50m

# The Secrets Apchi generates configuration into. These must be the names the Trino
# deployment mounts -- Apchi writes them, Trino reads them, and nothing reconciles a
# disagreement.

secrets:
  catalogSeed: trino-catalog-seed
  accessControl: trino-access-control
  certificateMapping: trino-user-mapping
  clientCertificates: trino-client-certificates
  resourceGroups: trino-resource-groups
  # internal-communication.shared-secret, which both roles read from their environment.
  # Apchi creates it on its first start when it is missing, with a random value, and never
  # touches it once it exists: a different secret on each role splits the Cluster.
  sharedSecret: trino-internal-shared-secret
  # Apchi writes it on its first start and on every Apply: the coordinator's own files
  # (ADR-0010). Created by Apchi, not by this chart -- its content is rendered from the Admin
  # values in MongoDB, which a chart cannot read.
  serverConfiguration: trino-server-config-coordinator
  # The workers' own files, the same way.
  workerServerConfiguration: trino-server-config-worker

# The volumes Apchi owns on the coordinator's pod template. Everything else there
# belongs to the Admin, and Apchi never touches it.
#
# The user-mapping Secret is not here: the Admin mounts it as a directory and Apchi only
# fills it (#93). The coordinator still names a volume for it, below, because something has
# to mount it -- but Apchi does not need to know that name.
volumes:
  resourceGroups: apchi-resource-groups
  # Mounted by the coordinator itself rather than by Apchi, because Trino is configured to
  # read the user-mapping file at startup and refuses to boot when it is missing. Apchi takes
  # the mount over from its first Apply; the name is what makes that handover invisible.
  certificateMapping: apchi-user-mapping

# Whether a Catalog the validation coordinator cannot connect to fails the Apply (#171).
#
# Validation asks each Catalog for its schemas, which is what makes it actually connect --
# CREATE CATALOG succeeds against a host that does not even resolve. Off by default, because
# the validation pod's network is not the coordinator's: a NetworkPolicy or a firewall that
# stands between the probe and a database would otherwise block every Apply for a
# configuration that works. The finding arrives as a warning on the Validation and the Apply
# instead.
#
# Turn it on where the probe and the coordinator are known to reach the same places, and an
# unreachable Catalog should stop a release.
validation:
  catalogConnectivityBlocksApply: false
  # Requests and limits for the Validation pod's container, which Apchi creates itself at
  # Validation time -- so this is the only place a cluster that requires them on every
  # container can set them. Trino needs about 2Gi to start. Empty sets none.
  resources: {}

timeouts:
  # How long a Rollout may take before the Apply fails. A coordinator that never comes
  # back must not hang the pipeline.
  rolloutSeconds: 600
  # The same for the workers, which are replaced one at a time and each drains first: allow
  # roughly (workers x (startup + terminationGracePeriodSeconds)).
  workerRolloutSeconds: 1800
  # The hard limit on Validation. A coordinator that never starts serving fails
  # Validation rather than hanging it.
  validationSeconds: 300

certificates:
  # How close to expiry a Client Certificate has to be before Apchi calls it expiring.
  # Renewal is manual for now, so this is the warning an Operator acts on.
  expiringWithinDays: 30
  # What a Kubernetes Secret may hold. An upload that would exceed it is refused with
  # that reason rather than as a rejected write from the API server.
  maxBytes: 1048576

# Where a failed Auto Rollback is reported -- a Mattermost or Slack incoming webhook.
# Empty means log only: an alert that cannot be delivered must never stop Maintenance
# Mode engaging.
alertWebhookUrl: ""

# Trino refuses to boot without the access-control rules and the user-mapping file, so a
# Cluster cannot wait for Apchi to write them. This chart creates all six Secrets Apchi
# writes into, **once, on install only**, and never touches them again -- Apchi owns their
# content from its first Apply, and a `helm upgrade` must not revert a permission change.
#
# They are pre-install hooks, so they exist before the coordinator this chart also runs:
# Trino mounts these and will not start without two of them.
#
# Set create: false when the Secrets already exist -- a second Apchi release against a Cluster
# that is already configured.
# No `bootstrap` any more. The chart creates none of the Secrets Apchi writes into: Apchi
# writes each one that is missing when it starts, from the latest Snapshot and the Admin values,
# and Trino's pods wait for them. Created by the chart, Argo CD recreated them on every sync --
# wiping the catalogs and permissions Apchi had applied (measured on kind).

# Anything not covered above, as APCHI_-prefixed names. An escape hatch for a setting
# newer than this chart.
extraEnv: []

resources:
  requests:
    memory: 256Mi
    cpu: 100m

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
