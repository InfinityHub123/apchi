apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apchi.fullname" . }}
  labels: {{- include "apchi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, not RollingUpdate. An Apply is in-process state -- the runner holds the
  # task and the Candidate lock -- so two Apchis would run two pipelines against one
  # Trino. The old pod has to be gone before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "apchi.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apchi.apiSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "apchi.serviceAccountName" . }}
      # Kubernetes otherwise injects a variable per Service in the namespace, and this chart's
      # own Service is called apchi -- so every pod gets APCHI_PORT, APCHI_SERVICE_HOST and
      # sixteen more that are not settings. Apchi tolerates them; it is simply noise.
      enableServiceLinks: false
      {{- if and (or .Values.trino.tls.existingSecret .Values.mongodb.tls.existingSecret) (not .Values.restrictedPodSecurity) }}
      # A Secret volume's files are root-owned whatever their mode, so a key restricted to
      # 0640 is unreadable to uid 10001 without this. Only rendered when something is
      # mounted: an fsGroup on a pod with no volumes changes nothing and would still cost
      # every install a restart. Never under restrictedPodSecurity, where the platform
      # assigns the group.
      securityContext:
        fsGroup: {{ .Values.pod.fsGroup }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: apchi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "apchi.containerSecurity" . | nindent 10 }}
          ports:
            - containerPort: 8000
              name: http
          env:
            {{- with .Values.environment }}
            # Deprecated: it now decides only the log defaults below, and Apchi warns while
            # it is set. Rendered so an existing values file keeps its log level for one
            # more release.
            - name: APCHI_ENVIRONMENT
              value: {{ . | quote }}
            {{- end }}
            - name: APCHI_AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            - name: APCHI_AUTH_INITIAL_ADMIN_USERNAME
              value: {{ .Values.auth.initialAdmin.username | quote }}
            {{- if .Values.auth.initialAdmin.existingSecret }}
            # From a Secret rather than from values: the hash is offline-crackable, so it is
            # worth keeping out of the release and out of `helm get values`.
            - name: APCHI_AUTH_INITIAL_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.initialAdmin.existingSecret | quote }}
                  key: {{ .Values.auth.initialAdmin.existingSecretKey | quote }}
            {{- else if .Values.auth.initialAdmin.passwordHash }}
            - name: APCHI_AUTH_INITIAL_ADMIN_PASSWORD_HASH
              value: {{ .Values.auth.initialAdmin.passwordHash | quote }}
            {{- end }}
            - name: APCHI_AUTH_SESSION_HOURS
              value: {{ .Values.auth.sessionHours | quote }}
            {{- if eq .Values.auth.mode "sso" }}
            - name: APCHI_OIDC_ISSUER
              value: {{ required "auth.oidc.issuer is required when auth.mode is sso" .Values.auth.oidc.issuer | quote }}
            - name: APCHI_OIDC_CLIENT_ID
              value: {{ required "auth.oidc.clientId is required when auth.mode is sso" .Values.auth.oidc.clientId | quote }}
            # The URL a browser reaches Apchi on, registered with the provider verbatim. A
            # wrong one is a login loop with no error, so it is required rather than guessed --
            # unless the chart exposes Apchi itself, and then it knows the host.
            - name: APCHI_OIDC_REDIRECT_URL
              {{- $exposed := ternary (printf "https://%s/api/v1/auth/sso/callback" .Values.expose.apchi.host) "" (not (empty .Values.expose.apchi.host)) }}
              value: {{ required "auth.oidc.redirectUrl is required when auth.mode is sso and expose.apchi.host is not set" (.Values.auth.oidc.redirectUrl | default $exposed) | quote }}
            {{- if .Values.auth.oidc.existingSecret }}
            # From a Secret rather than from values, for the same reason as the admin hash:
            # the client secret authenticates Apchi to the provider.
            - name: APCHI_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.existingSecret | quote }}
                  key: {{ .Values.auth.oidc.existingSecretKey | quote }}
            {{- else if .Values.auth.oidc.clientSecret }}
            - name: APCHI_OIDC_CLIENT_SECRET
              value: {{ .Values.auth.oidc.clientSecret | quote }}
            {{- end }}
            - name: APCHI_OIDC_SCOPES
              value: {{ .Values.auth.oidc.scopes | quote }}
            - name: APCHI_OIDC_USERNAME_CLAIM
              value: {{ .Values.auth.oidc.usernameClaim | quote }}
            - name: APCHI_OIDC_ROLE_CLAIM
              value: {{ .Values.auth.oidc.roleClaim | quote }}
            - name: APCHI_OIDC_ADMIN_GROUPS
              value: {{ .Values.auth.oidc.adminGroups | quote }}
            {{- end }}
            {{- if .Values.audit.retentionDays }}
            # Only when set: unset means no TTL index and history kept forever, which is the
            # default on purpose.
            - name: APCHI_AUDIT_RETENTION_DAYS
              value: {{ .Values.audit.retentionDays | quote }}
            {{- end }}
            # `int` before quoting: YAML parses a large plain number as a float, and
            # `quote` alone renders it as 1.572864e+07, which the settings parser rejects.
            - name: APCHI_CANDIDATE_MAX_BYTES
              value: {{ .Values.candidateMaxBytes | int | quote }}
            {{- if include "apchi.hasCaBundle" . }}
            # One CA for every destination below -- MongoDB, the coordinator, the OIDC
            # provider and the alert webhook -- so it is set before any of them. Apchi adds
            # it to the public store; it also reaches the Validation pod, mounted the same way.
            - name: APCHI_CA_FILE
              value: "/etc/pki/tls/certs/ca-bundle.crt"
            - name: APCHI_VALIDATION_CA_BUNDLE
              value: {{ include "apchi.validationCaBundle" . | quote }}
            {{- end }}
            - name: APCHI_MONGO_URI
              value: {{ include "apchi.mongoUri" . | quote }}
            - name: APCHI_MONGO_DATABASE
              value: {{ .Values.mongodb.database | quote }}
            {{- $mongoTls := .Values.mongodb.tls }}
            {{- if $mongoTls.existingSecret }}
            {{- if and $mongoTls.certificateKeyKey (or $mongoTls.certificateKey $mongoTls.keyKey) }}
            {{- fail "mongodb.tls: set certificateKeyKey, one file holding both, or certificateKey and keyKey -- not both shapes" }}
            {{- end }}
            {{- if $mongoTls.certificateKeyKey }}
            - name: APCHI_MONGO_CERTIFICATE_KEY_FILE
              value: {{ printf "%s/%s" $mongoTls.mountPath $mongoTls.certificateKeyKey | quote }}
            {{- end }}
            {{- if $mongoTls.certificateKey }}
            - name: APCHI_MONGO_CERTIFICATE_FILE
              value: {{ printf "%s/%s" $mongoTls.mountPath $mongoTls.certificateKey | quote }}
            - name: APCHI_MONGO_KEY_FILE
              value: {{ printf "%s/%s" $mongoTls.mountPath (required "mongodb.tls.keyKey is required when mongodb.tls.certificateKey is set" $mongoTls.keyKey) | quote }}
            {{- end }}
            {{- end }}
            # Apchi reads and writes only this namespace: the Cluster's own. Taken from
            # the pod rather than a value, so it cannot disagree with where it runs.
            - name: APCHI_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APCHI_TRINO_URL
              value: {{ include "trino.url" . | quote }}
            {{- $tls := .Values.trino.tls }}
            {{- if $tls.existingSecret }}
            # Each path is the mount point plus the Secret's own key, so a file is named
            # once in values and nothing has to agree with a literal twice.
            {{- if $tls.certificateKey }}
            - name: APCHI_TRINO_AUTH_CERTIFICATE_FILE
              value: {{ printf "%s/%s" $tls.mountPath $tls.certificateKey | quote }}
            - name: APCHI_TRINO_AUTH_KEY_FILE
              value: {{ printf "%s/%s" $tls.mountPath (required "trino.tls.keyKey is required when trino.tls.certificateKey is set" $tls.keyKey) | quote }}
            {{- end }}
            {{- end }}
            - name: APCHI_TRINO_USER
              value: {{ .Values.trino.user | quote }}
            # The Trino this chart runs, by the same helpers that name it, so the two cannot
            # disagree.
            - name: APCHI_COORDINATOR_DEPLOYMENT_NAME
              value: {{ include "trino.coordinatorName" . | quote }}
            - name: APCHI_WORKER_DEPLOYMENT_NAME
              value: {{ include "trino.workerName" . | quote }}
            - name: APCHI_TRINO_CONTAINER_NAME
              value: "trino"
            - name: APCHI_CATALOG_STORE_DIR
              value: {{ .Values.trino.catalogStoreDir | quote }}
            # Wiring: what Apchi renders into Trino's own files that names something this
            # chart creates. Passed from the same values that create the ports, Service and
            # mounts, so the files and the objects cannot disagree (ADR-0010).
            - name: APCHI_SERVER_CONFIGURATION_SECRET_NAME
              value: {{ .Values.secrets.serverConfiguration | quote }}
            - name: APCHI_WORKER_SERVER_CONFIGURATION_SECRET_NAME
              value: {{ .Values.secrets.workerServerConfiguration | quote }}
            - name: APCHI_TRINO_WORKER_SHUTDOWN_GRACE_PERIOD
              value: {{ printf "%ds" (int .Values.trino.worker.gracefulShutdown.gracePeriodSeconds) | quote }}
            - name: APCHI_TRINO_HTTP_PORT
              value: {{ .Values.trino.httpPort | int64 | quote }}
            - name: APCHI_TRINO_DISCOVERY_URI
              value: {{ include "trino.discoveryUri" . | quote }}
            {{- if .Values.trino.https.enabled }}
            - name: APCHI_TRINO_HTTPS_PORT
              value: {{ .Values.trino.https.port | int64 | quote }}
            - name: APCHI_TRINO_HTTPS_KEYSTORE_PATH
              value: {{ include "trino.httpsKeystore" . | quote }}
            {{- end }}
            - name: APCHI_TRINO_PROCESS_FORWARDED
              value: {{ include "trino.behindTlsProxy" . | empty | not | quote }}
            - name: APCHI_TRINO_AUTHENTICATION_TYPE
              # The helper refuses a type Trino has no user-mapping property for.
              value: {{ $_ := include "trino.userMappingProperty" . }}{{ .Values.trino.authentication.type | quote }}
            - name: APCHI_TRINO_ENVIRONMENT
              value: {{ .Values.trino.environment | quote }}
            - name: APCHI_TRINO_SECURITY_REFRESH_PERIOD
              value: {{ required "trino.securityRefreshPeriod is required" .Values.trino.securityRefreshPeriod | quote }}
            {{- if include "apchi.hasTruststore" . }}
            - name: APCHI_TRINO_JAVA_TRUSTSTORE_PATH
              value: "/etc/pki/java/truststore/cacerts"
            {{- end }}
            - name: APCHI_VERIFICATION_CATALOG
              value: {{ .Values.trino.verificationCatalog | quote }}
            - name: APCHI_CATALOG_SECRET_NAME
              value: {{ .Values.secrets.catalogSeed | quote }}
            - name: APCHI_ACCESS_CONTROL_SECRET_NAME
              value: {{ .Values.secrets.accessControl | quote }}
            - name: APCHI_EVENT_LISTENER_SECRET_NAME
              value: {{ .Values.secrets.eventListener | quote }}
            - name: APCHI_CERTIFICATE_MAPPING_SECRET_NAME
              value: {{ .Values.secrets.certificateMapping | quote }}
            - name: APCHI_CLIENT_CERTIFICATE_SECRET_NAME
              value: {{ .Values.secrets.clientCertificates | quote }}
            - name: APCHI_RESOURCE_GROUPS_SECRET_NAME
              value: {{ .Values.secrets.resourceGroups | quote }}
            - name: APCHI_EVENT_LISTENER_VOLUME_NAME
              value: {{ .Values.volumes.eventListener | quote }}
            - name: APCHI_RESOURCE_GROUPS_VOLUME_NAME
              value: {{ .Values.volumes.resourceGroups | quote }}
            - name: APCHI_CATALOG_CONNECTIVITY_BLOCKS_APPLY
              value: {{ .Values.validation.catalogConnectivityBlocksApply | quote }}
            - name: APCHI_ROLLOUT_TIMEOUT_SECONDS
              value: {{ .Values.timeouts.rolloutSeconds | int64 | quote }}
            - name: APCHI_WORKER_ROLLOUT_TIMEOUT_SECONDS
              value: {{ .Values.timeouts.workerRolloutSeconds | int64 | quote }}
            - name: APCHI_VALIDATION_TIMEOUT_SECONDS
              value: {{ .Values.timeouts.validationSeconds | int64 | quote }}
            {{- if include "apchi.hasTruststore" . }}
            # Apchi is not Java and never reads it; the Validation pod it creates runs Trino.
            - name: APCHI_VALIDATION_JAVA_TRUSTSTORE
              value: {{ include "apchi.validationTruststore" . | quote }}
            {{- end }}
            {{- with .Values.validation.resources }}
            - name: APCHI_VALIDATION_RESOURCES
              value: {{ toJson . | quote }}
            {{- end }}
            {{- if .Values.restrictedPodSecurity }}
            - name: APCHI_RESTRICTED_POD_SECURITY
              value: "true"
            {{- end }}
            - name: APCHI_CERTIFICATE_EXPIRING_WITHIN_DAYS
              value: {{ .Values.certificates.expiringWithinDays | int64 | quote }}
            - name: APCHI_CLIENT_CERTIFICATE_MAX_BYTES
              value: {{ .Values.certificates.maxBytes | int64 | quote }}
            {{- with .Values.alertWebhookUrl }}
            - name: APCHI_ALERT_WEBHOOK_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.logging.level }}
            - name: APCHI_LOG_LEVEL
              value: {{ . | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .Values.logging.json) }}
            - name: APCHI_LOG_JSON
              value: {{ .Values.logging.json | quote }}
            {{- end }}
            {{- if .Values.logging.debug }}
            - name: APCHI_DEBUG
              value: "true"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            # /api/v1/health reports 503 while MongoDB is unreachable, which is exactly
            # when Apchi must take no requests.
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            # Startup with nothing reachable spends PyMongo's own server-selection
            # timeout before the app answers at all.
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
            # A Validation holds the loop for up to validationSeconds doing nothing
            # visible; a short budget here would kill it mid-Apply.
            failureThreshold: {{ max 6 (div (int .Values.timeouts.validationSeconds) 20 | int) }}
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.trino.tls.existingSecret .Values.mongodb.tls.existingSecret (include "apchi.hasCaBundle" .) }}
          volumeMounts:
            {{- include "apchi.trustMounts" (dict "root" $ "java" false) | trim | nindent 12 }}
            {{- if .Values.trino.tls.existingSecret }}
            - name: trino-tls
              mountPath: {{ .Values.trino.tls.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.mongodb.tls.existingSecret }}
            - name: mongo-tls
              mountPath: {{ .Values.mongodb.tls.mountPath | quote }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.trino.tls.existingSecret .Values.mongodb.tls.existingSecret (include "apchi.hasCaBundle" .) }}
      volumes:
        {{- include "apchi.trustVolumes" (dict "root" $ "java" false) | trim | nindent 8 }}
        {{- if .Values.trino.tls.existingSecret }}
        - name: trino-tls
          secret:
            secretName: {{ .Values.trino.tls.existingSecret | quote }}
            # A credential, and 0640 is the floor: the kubelet ORs 0440 into the mode of
            # every file in a readOnly volume, so 0600 is unreachable. Under restricted pod
            # security it is 0644, the only mode an arbitrary uid can read, in a pod with one
            # container that reads each key once at startup.
            defaultMode: {{ include "apchi.credentialFileMode" . }}
        {{- end }}
        {{- if .Values.mongodb.tls.existingSecret }}
        - name: mongo-tls
          secret:
            secretName: {{ .Values.mongodb.tls.existingSecret | quote }}
            defaultMode: {{ include "apchi.credentialFileMode" . }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
