{{- include "trino.refuseMovedValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trino.coordinatorName" . }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "trino.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        {{- include "trino.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: coordinator
      {{- with .Values.trino.coordinator.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.trino.fsGroup }}
      # The group that owns Apchi's Secret volumes. Without it the 0640 below is
      # root:root, which the `trino` user cannot read -- including the seed initContainer,
      # which runs as the image's user too. See values.yaml for the measurements.
      securityContext:
        fsGroup: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Seeds the writable store directory from the Secret Apchi patches, before Trino
        # reads it. FileCatalogStore enumerates the directory only in its constructor, so
        # anything absent here is absent until the next pod start -- which is why the
        # durable copy of every catalog lives in etcd and not on a volume.
        #
        # Apchi asserts this initContainer exists before every Apply. Without it the
        # Cluster comes up with no catalogs at all.
        - name: seed-catalogs
          image: {{ include "trino.image" . | quote }}
          imagePullPolicy: {{ .Values.trino.image.pullPolicy }}
          {{- include "trino.containerSecurity" . | nindent 10 }}
          command: ["sh", "-c"]
          args:
            - mkdir -p {{ .Values.trino.catalogStoreDir }} &&
              cp -L /data/trino/catalog-seed/*.properties {{ .Values.trino.catalogStoreDir }}/ 2>/dev/null || true;
              ls -l {{ .Values.trino.catalogStoreDir }}
          volumeMounts:
            - {name: catalog-seed, mountPath: /data/trino/catalog-seed, readOnly: true}
            - {name: catalog-store, mountPath: {{ .Values.trino.catalogStoreDir }}}
          {{- with .Values.trino.coordinator.seedResources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if (include "trino.https" .) }}
        # Trino's PEM keystore is one file with the key and the certificate chain together;
        # a TLS Secret holds them apart. The newline between them is not decoration: a key
        # without a trailing one runs into the certificate's BEGIN line and neither parses.
        - name: join-https-keystore
          image: {{ include "trino.image" . | quote }}
          imagePullPolicy: {{ .Values.trino.image.pullPolicy }}
          {{- include "trino.containerSecurity" . | nindent 10 }}
          command: ["sh", "-c"]
          args:
            - umask 077 &&
              { cat /etc/trino-https-source/key.pem; echo; cat /etc/trino-https-source/certificate.pem; } > {{ include "trino.httpsKeystore" . }}
              {{- if eq .Values.trino.authentication.type "certificate" }} &&
              cp /etc/trino-https-source/client-ca.pem {{ include "trino.clientCa" . }}
              {{- end }}
          volumeMounts:
            - {name: https-source, mountPath: /etc/trino-https-source, readOnly: true}
            - {name: https-keystore, mountPath: /data/trino-https}
          {{- with .Values.trino.coordinator.seedResources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      containers:
        - name: trino
          image: {{ include "trino.image" . | quote }}
          imagePullPolicy: {{ .Values.trino.image.pullPolicy }}
          # Sizing: the heap and JVM flags, and the query memory config.properties refers to.
          # On the pod rather than in a file, so a change to them rolls the pod together with
          # the memory limit they have to fit.
          env: {{- include "trino.jvmEnv" (dict "root" . "role" "coordinator") | trim | nindent 12 }}
          ports:
            - containerPort: {{ .Values.trino.httpPort }}
              name: http
            {{- if (include "trino.https" .) }}
            - containerPort: {{ .Values.trino.https.port }}
              name: https
            {{- end }}
          {{- include "trino.probes" (dict "root" . "role" "coordinator") | nindent 10 }}
          {{- include "trino.containerSecurity" . | nindent 10 }}
          readinessProbe:
            # Trino's own script. A Rollout's "complete" means every replica passed this,
            # which is what makes Apchi's Verification talk to a coordinator that answers.
            exec: {command: ["/usr/lib/trino/bin/health-check"]}
            initialDelaySeconds: {{ .Values.trino.coordinator.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.trino.coordinator.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.trino.coordinator.readinessProbe.failureThreshold }}
          volumeMounts:
            # Trino's own files, which Apchi renders -- wiring from this chart's values, the
            # rest from the Admin's Server Configuration -- and this chart only mounts
            # (ADR-0010). One mount each, never the whole of /etc/trino: Apchi mounts single
            # files inside it too, and a subPath mount inside a directory volume fails the
            # container with "not a directory" (#93).
            #
            # subPath, and fixed: every one of these needs a restart to take effect anyway,
            # and the Rollout Apchi issues is what makes new content live. The pod waits in
            # ContainerCreating until Apchi has written the Secret on its first start.
            {{- range list "config.properties" "node.properties" "jvm.config" "log.properties" "catalog-store.properties" "access-control.properties" }}
            - {name: server-config, mountPath: /etc/trino/{{ . }}, subPath: {{ . }}}
            {{- end }}
            # The same Secret, whole, for the one file of it that is optional: the Event
            # Listener, which config.properties names when the Admin configures one. A subPath
            # mount of a key the Secret does not hold is a pod that cannot start, where a
            # directory without the file is simply no listener. Fixed, like the rest: Apchi
            # never adds or removes a mount for it.
            - {name: server-config, mountPath: /etc/trino/apchi, readOnly: true}
            # Apchi-managed. Whole volume, never subPath: a subPath mount is frozen at pod
            # creation, so the kubelet would never project a rewritten rules file and a
            # permission change would be reported as applied and never arrive (§16).
            - {name: access-control, mountPath: /etc/trino/access-control, readOnly: true}
            # The Admin's mount; Apchi only fills the Secret. The coordinator is configured
            # to read this file at startup and Trino refuses to boot when it is missing, so
            # it cannot wait for Apchi's first Apply.
            #
            # A whole directory. The rules are read once when the authenticator is built, so
            # this one does not need the kubelet to project an update -- but a single-file
            # mount cannot be placed inside a whole /etc/trino mount, which is the shape the
            # official chart uses, so a directory is the shape that works everywhere (#93).
            - {name: {{ .Values.volumes.certificateMapping }}, mountPath: /etc/trino/user-mapping, readOnly: true}
            # Whole volume, never subPath: a certificate uploaded after this pod started
            # must appear here without a restart, and a subPath mount never updates
            # (ADR-0005).
            - {name: client-certificates, mountPath: /etc/trino/certs, readOnly: true}
            # Writable, and an emptyDir rather than a Secret or ConfigMap: Trino writes
            # this directory itself and those mounts are always read-only, so every
            # CREATE CATALOG would fail. Apchi asserts that too.
            - {name: catalog-store, mountPath: {{ .Values.trino.catalogStoreDir }}}
            # node.data-dir. The catalog store above is mounted inside it, separately,
            # because it is the seed initContainer's to fill.
            - {name: data, mountPath: /data/trino}
            {{- if (include "trino.https" .) }}
            - {name: https-keystore, mountPath: /data/trino-https, readOnly: true}
            {{- end }}
            {{- if or (include "apchi.hasCaBundle" .) (include "apchi.hasTruststore" .) }}
            # What this pod trusts, if the chart names it. See caBundle and javaTruststore.
            {{- include "apchi.trustMounts" (dict "root" $ "java" true) | trim | nindent 12 }}
            {{- end }}
          {{- with .Values.trino.coordinator.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        # The Admin's properties can be credentials -- internal-communication.shared-secret,
        # an OAuth client secret -- so 0640 with the fsGroup above, like the others. §13.2.
        - {name: server-config, secret: {secretName: {{ .Values.secrets.serverConfiguration }}, defaultMode: 0640}}
        - {name: access-control, secret: {secretName: {{ .Values.secrets.accessControl }}}}
        - {name: {{ .Values.volumes.certificateMapping }}, secret: {secretName: {{ .Values.secrets.certificateMapping }}}}
        # Both of these hold credentials, so neither may be world-readable: the catalog
        # seed carries every catalog's `connection-password`, and the certificate volume
        # carries private keys. 0640 with the fsGroup above is root-owned and
        # group-readable, which is what libpq will accept for a key file and what the
        # kubelet's roMask floor allows. §13.2.
        - {name: catalog-seed, secret: {secretName: {{ .Values.secrets.catalogSeed }}, defaultMode: 0640}}
        - {name: client-certificates, secret: {secretName: {{ .Values.secrets.clientCertificates }}, defaultMode: 0640}}
        # Ephemeral by design. Durability lives in the catalog seed Secret, not here.
        - {name: catalog-store, emptyDir: {}}
        # Writable by whatever uid the pod is given. The launcher writes its pid file under
        # it and creates `etc`, a symlink to /etc/trino, at its root -- so the whole data
        # directory has to be writable, not only var/. The image's own belongs to uid 1000.
        - {name: data, emptyDir: {}}
        {{- if (include "trino.https" .) }}
        # The server's private key, so restricted as the other credential volumes are.
        - name: https-source
          secret:
            secretName: {{ required "trino.https.existingSecret is required: the coordinator serves HTTPS when trino.https.enabled is set or trino.authentication.type is certificate. Provide the server certificate (cert-manager writes this shape), or set trino.authentication.type=insecure for plain HTTP." .Values.trino.https.existingSecret }}
            defaultMode: 0640
            items:
              - {key: {{ .Values.trino.https.certificateKey }}, path: certificate.pem}
              - {key: {{ .Values.trino.https.keyKey }}, path: key.pem}
              {{- if eq .Values.trino.authentication.type "certificate" }}
              - {key: {{ required "trino.https.clientCaKey is required under certificate authentication" .Values.trino.https.clientCaKey }}, path: client-ca.pem}
              {{- end }}
        # Memory-backed, so the joined key is never written to the node's disk.
        - {name: https-keystore, emptyDir: {medium: Memory}}
        {{- end }}
        {{- if or (include "apchi.hasCaBundle" .) (include "apchi.hasTruststore" .) }}
        {{- include "apchi.trustVolumes" (dict "root" $ "java" true) | trim | nindent 8 }}
        {{- end }}
        # No volume for the resource-groups Secret. The absence of the mount is how "none
        # configured" is expressed -- Trino refuses to start if a file it was told to read is
        # missing -- so Apchi adds and removes that volume itself, with the Admin's Raw Files.
      {{- with .Values.trino.coordinator.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.trino.coordinator.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.trino.coordinator.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
