{{- if .Values.networkPolicy.enabled }}
{{- /*
Who may reach Trino. Without this, any pod that can route to the coordinator's port can query
it -- and with `insecure` authentication it can claim to be any user, admin included, by
sending X-Trino-User. Egress is left alone: Trino reaches databases, object stores and DNS that
this chart cannot enumerate, and a policy that guessed would break catalogs silently.

Under certificate authentication the HTTP port takes the user name a client sends, so it is
Trino's own pods', Apchi's and the metrics scraper's alone, and everyone else -- the router, a Trino Gateway, BI
tools -- comes to the HTTPS port, which authenticates them and so needs no list.

The ports are the container ports, because a NetworkPolicy is evaluated at the pod, after the
Service has translated its port.
*/ -}}
{{- $certificate := eq .Values.trino.authentication.type "certificate" -}}
{{- $ports := list (int .Values.trino.httpPort) -}}
{{- if (include "trino.https" .) -}}
{{- $ports = append $ports (int .Values.trino.https.port) -}}
{{- end -}}
{{- $np := .Values.networkPolicy -}}
{{- $routed := and .Values.expose.trino.host (eq (include "apchi.exposeKind" .) "route") -}}
{{- $ingressed := and .Values.expose.trino.host (eq (include "apchi.exposeKind" .) "ingress") -}}
{{- if and $ingressed (not $np.ingressControllerNamespaceSelector) (not $certificate) }}
{{- fail "networkPolicy.ingressControllerNamespaceSelector is required when Trino is exposed by an Ingress: the policy has to let the controller's pods through, and only you know which namespace they run in (for ingress-nginx, {kubernetes.io/metadata.name: ingress-nginx})" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trino.coordinatorName" . }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
spec:
  podSelector:
    matchLabels:
      {{- include "trino.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: coordinator
  policyTypes: [Ingress]
  ingress:
    - from:
        # The workers announcing themselves and returning results, and the coordinator itself.
        - podSelector:
            matchLabels:
              {{- include "trino.selectorLabels" . | nindent 14 }}
        # Apchi: every query it issues, Verification and the catalog DDL among them. Its API
        # pods only -- the bundled MongoDB shares the name and instance labels.
        - podSelector:
            matchLabels:
              {{- include "apchi.apiSelectorLabels" . | nindent 14 }}
        {{- with $np.scrapers }}
        # The metrics scraper, which reads /metrics on the HTTP port in either mode.
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if $certificate }}
      ports:
        - {protocol: TCP, port: {{ .Values.trino.httpPort }}}
    # Anyone, because HTTPS authenticates whoever comes: the Route or Ingress, and every client.
    - ports:
        - {protocol: TCP, port: {{ .Values.trino.https.port }}}
      {{- else }}
        {{- if $routed }}
        # OpenShift's router, for the Route. Both labels, because the network plugins differ:
        # OVN-Kubernetes selects the router's namespace by the first, OpenShift SDN by the second.
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
        {{- end }}
        {{- if $ingressed }}
        # The ingress controller, for the Ingress.
        - namespaceSelector:
            matchLabels: {{- toYaml $np.ingressControllerNamespaceSelector | nindent 14 }}
        {{- end }}
        {{- with $np.coordinator.from }}
        # Whoever else queries Trino directly: a Trino Gateway, BI tools in another namespace.
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        {{- range $ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
      {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trino.workerName" . }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      {{- include "trino.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes: [Ingress]
  ingress:
    # Only Trino talks to a worker: the coordinator assigning tasks, and workers exchanging data.
    # Nobody else has a reason to, and a worker's own port answers the drain request.
    - from:
        - podSelector:
            matchLabels:
              {{- include "trino.selectorLabels" . | nindent 14 }}
        {{- with $np.scrapers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $np.worker.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.trino.httpPort }}}
{{- end }}
