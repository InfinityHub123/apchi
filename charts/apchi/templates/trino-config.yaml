apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trino.fullname" . }}-config
  labels: {{- include "trino.labels" . | nindent 4 }}
data:
  # The workers' files, and only theirs. The coordinator's are rendered by Apchi into the
  # server-configuration Secret, and this chart renders none of them (ADR-0010); the workers'
  # follow in the next stage. Sizing is not in any file: it reaches Trino on the pod, beside
  # the memory limit it has to fit -- see trino.<role>.jvm and trino.<role>.memory.
  worker-config.properties: |
    coordinator=false
    http-server.http.port={{ .Values.trino.httpPort }}
    discovery.uri={{ include "trino.discoveryUri" . }}
    catalog.management=dynamic
    query.max-memory-per-node=${ENV:TRINO_QUERY_MAX_MEMORY_PER_NODE}
    memory.heap-headroom-per-node=${ENV:TRINO_MEMORY_HEAP_HEADROOM_PER_NODE}
    {{- range .Values.trino.additionalWorkerProperties }}
    {{ . }}
    {{- end }}
  # The image's own node.properties sets node.data-dir too, and this file replaces it whole.
  # Without the line the launcher falls back to /usr/lib/trino for its pid file and its
  # `etc` symlink, which only uid 1000 can write -- so under an arbitrary uid, OpenShift's,
  # Trino never starts.
  node.properties: |
    node.environment={{ .Values.trino.environment }}
    node.data-dir=/data/trino
  # No heap flag and no tuning: the JVM reads this file after JDK_JAVA_OPTIONS and the last
  # flag wins, so a flag here would silently override the chart's sizing (measured on
  # Trino 483). Only what Trino or the mounts require.
  jvm.config: |
    -Djdk.attach.allowAttachSelf=true
    {{- if include "apchi.hasTruststore" . }}
    -Djavax.net.ssl.trustStore=/etc/pki/java/truststore/cacerts
    {{- end }}
