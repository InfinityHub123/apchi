name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, types, contract and tier 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev

      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy

      # The API contract is a product surface. A change to it must arrive as a
      # reviewed diff rather than as a side effect of a refactor.
      - name: OpenAPI contract unchanged
        run: uv run python scripts/export_openapi.py --check

      - name: Access-control manifest matches what Apchi generates
        run: uv run python scripts/export_access_control.py --check

      - name: The committed user-mapping Secret matches what Apchi generates
        run: uv run python scripts/export_user_mapping.py --check

      # Real MongoDB and real Trino via Testcontainers; only Kubernetes is faked.
      - name: Tier 1 -- behavioural
        # A per-test limit so a test that stops making progress names itself. Without it a
        # suite that stalls looks like a suite that is working, and the job dies on the
        # runner's own timeout with nothing to point at. Generous: the slowest test here
        # genuinely restarts a Trino container.
        run: uv run pytest tests/tier1 -q --timeout=300 --timeout-method=signal

  image:
    name: The image docs/getting-started.md tells you to build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Not pushed anywhere: this exists so the Dockerfile cannot rot while the
      # getting-started walkthrough keeps telling a new user to build it. A broken
      # Dockerfile is the first thing they would hit and the last thing anyone would
      # notice.
      - name: Build
        run: docker build -t apchi:ci .
      - name: It starts and serves
        run: |
          # No MongoDB, so /api/v1/health reports 503 by design -- any HTTP answer at all
          # proves the image's dependencies resolved and the app imported.
          #
          # The wait is generous because startup with nothing reachable takes about a
          # minute, measured: PyMongo spends its 30s server-selection timeout on the
          # interrupted-Apply recovery, and the orphaned-validation sweep then spends its
          # own on a Kubernetes that is not there. Both are meant to fail that way --
          # starting degraded and reporting 503 beats crashlooping on a transient blip.
          docker run -d --name apchi -p 8000:8000 -e APCHI_MONGO_URI=mongodb://127.0.0.1:1 apchi:ci
          for _ in $(seq 120); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/v1/health || true)
            case "$code" in 200|503) echo "serving ($code)"; exit 0;; esac
            sleep 1
          done
          docker logs apchi
          exit 1

  tier2:
    # Sharded because the suite is dominated by coordinator restarts, which are wall clock
    # and not work -- one job spent seventeen minutes mostly waiting for pods. Each shard
    # gets its own kind cluster, so they cannot contend over the one Trino they all reset.
    #
    # The split is computed from the directory rather than listed here, so a new tier 2 file
    # runs without anyone remembering to add it. A hand-written list is how the adapter
    # conformance check came to miss a method twice.
    name: Tier 2 -- end to end on kind (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev

      - name: Select this shard's tests
        id: shard
        run: |
          # One line, space separated. A multi-line output turns the pytest step into
          # several shell lines, and the second one tries to *execute* a test file.
          files=$(ls tests/tier2/test_*.py | awk "NR % 4 == ${{ matrix.shard }} % 4" | tr '\n' ' ')
          test -n "$files" || { echo "shard ${{ matrix.shard }} selected no files"; exit 1; }
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "$files"

      - name: Create cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: apchi

      - name: Deploy Trino
        run: |
          kubectl apply -f deploy/trino-dev/
          kubectl rollout status deploy/trino-coordinator --timeout=600s
          kubectl rollout status deploy/trino-worker --timeout=600s

      - name: Tier 2 -- against the real cluster
        run: uv run pytest ${{ steps.shard.outputs.files }} -q

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe deploy/trino-coordinator
          kubectl logs deploy/trino-coordinator -c seed-catalogs --tail=50 || true
          kubectl logs deploy/trino-coordinator -c trino --tail=100 || true
