name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, types, contract and tier 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev

      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy

      # The API contract is a product surface. A change to it must arrive as a
      # reviewed diff rather than as a side effect of a refactor.
      - name: OpenAPI contract unchanged
        run: uv run python scripts/export_openapi.py --check

      - name: Access-control manifest matches what Apchi generates
        run: uv run python scripts/export_access_control.py --check

      - name: The committed user-mapping Secret matches what Apchi generates
        run: uv run python scripts/export_user_mapping.py --check

      # The chart is how Apchi is installed, and both ways it can drift from the
      # application produce a pod that will not start: a name no setting reads, which
      # Settings ignores so Apchi silently runs on a default, and a value it will not
      # parse -- Helm rendered 1048576 as "1.048576e+06" the first time this was
      # written, which Pydantic refuses outright.
      - name: Helm charts are ones Apchi accepts
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint charts/apchi --values charts/apchi/ci/https.yaml
          helm lint charts/apchi --set mongodb.deploy=true --set trino.https.enabled=false
          uv run python scripts/check_chart_env.py
          # Renders the chart's Trino and runs Apchi's own preconditions against it, rather
          # than a second opinion about what they mean. A chart that ships with Apchi must
          # not be able to drift into something Apchi refuses to Apply against.
          uv run python scripts/check_trino_chart.py
          # deploy/trino-dev is rendered from that same chart, and it is what every tier 2
          # test runs against -- so a chart fix not mirrored into it was a fix no
          # end-to-end test exercised. Here rather than beside the other three export
          # checks because it is the only one that needs Helm.
          uv run python scripts/export_trino_dev.py --check

      # Real MongoDB and real Trino via Testcontainers; only Kubernetes is faked.
      - name: Tier 1 -- behavioural
        # A per-test limit so a test that stops making progress names itself. Without it a
        # suite that stalls looks like a suite that is working, and the job dies on the
        # runner's own timeout with nothing to point at. Generous: the slowest test here
        # genuinely restarts a Trino container.
        run: uv run pytest tests/tier1 -q --timeout=300 --timeout-method=signal

  docs:
    name: The documentation site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra docs

      # --strict fails the build on a warning, and mkdocs.yml turns two things into
      # warnings that are otherwise silent: a link whose target moved, and a doc file
      # that is in the tree but in no nav entry. The second is how a docs site rots --
      # the page still exists, nothing links to it, and nobody notices for a year.
      - name: Build
        run: uv run mkdocs build --strict

  image:
    name: The image docs/getting-started.md tells you to build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Not pushed anywhere: this exists so the Dockerfile cannot rot while the
      # getting-started walkthrough keeps telling a new user to build it. A broken
      # Dockerfile is the first thing they would hit and the last thing anyone would
      # notice.
      - name: Build
        run: docker build -t apchi:ci .
      - name: It starts and serves
        run: |
          # No MongoDB, so /api/v1/health reports 503 by design -- any HTTP answer at all
          # proves the image's dependencies resolved and the app imported.
          #
          # The wait is generous because startup with nothing reachable takes about a
          # minute, measured: PyMongo spends its 30s server-selection timeout on the
          # interrupted-Apply recovery, and the orphaned-validation sweep then spends its
          # own on a Kubernetes that is not there. Both are meant to fail that way --
          # starting degraded and reporting 503 beats crashlooping on a transient blip.
          docker run -d --name apchi -p 8000:8000 -e APCHI_MONGO_URI=mongodb://127.0.0.1:1 apchi:ci
          for _ in $(seq 120); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/v1/health || true)
            case "$code" in 200|503) echo "serving ($code)"; exit 0;; esac
            sleep 1
          done
          docker logs apchi
          exit 1

  tier2:
    # Sharded because the suite is dominated by coordinator restarts, which are wall clock
    # and not work -- one job spent seventeen minutes mostly waiting for pods. Each shard
    # gets its own kind cluster, so they cannot contend over the one Trino they all reset.
    #
    # The split is computed from the directory and the measured cost of each file
    # (scripts/tier2_shards.py), so a new tier 2 file runs without anyone remembering to add
    # it. A hand-written list is how the adapter conformance check came to miss a method twice.
    name: Tier 2 -- end to end on kind (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev

      - name: Select this shard's tests
        id: shard
        run: |
          # One line, space separated. A multi-line output turns the pytest step into
          # several shell lines, and the second one tries to *execute* a test file.
          files=$(uv run python scripts/tier2_shards.py ${{ matrix.shard }} 4)
          test -n "$files" || { echo "shard ${{ matrix.shard }} selected no files"; exit 1; }
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "$files"

      - name: Create cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: apchi

      - name: Deploy Trino
        run: |
          kubectl apply -f deploy/trino-dev/
          kubectl rollout status deploy/trino-coordinator --timeout=600s
          kubectl rollout status deploy/trino-worker --timeout=600s

      - name: Tier 2 -- against the real cluster
        # The slowest tests, by name: the suite is dominated by Trino restarts, and which test
        # pays for one is what deciding where to merge or move tests needs (#300).
        run: uv run pytest ${{ steps.shard.outputs.files }} -q --durations=0 --durations-min=1

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe deploy/trino-coordinator
          kubectl logs deploy/trino-coordinator -c seed-catalogs --tail=50 || true
          kubectl logs deploy/trino-coordinator -c trino --tail=100 || true

  argo-cd:
    # charts/apchi under a real Argo CD with automated sync, prune and self-heal. Argo CD does
    # not run Helm: it renders the chart and runs its hooks as sync hooks on every sync, which is
    # how a chart-created Secret came to be reset on each one and wipe what Apchi had applied.
    # Only a real Argo CD shows that -- helm upgrade and kubectl apply both left them alone.
    name: Argo CD -- a sync keeps what Apchi applied
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Create cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: apchi
      - name: Build Apchi's image into the cluster
        run: |
          docker build -t apchi:argotest .
          kind load docker-image apchi:argotest --name apchi
      - name: Argo CD -- an unrelated sync after an Apply
        run: uv run pytest tests/argo -q -rs
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n argocd get application apchi -o yaml
          kubectl logs deploy/apchi --tail=200
          kubectl logs deploy/trino-coordinator -c trino --tail=100 || true

  network-policy:
    # charts/apchi's NetworkPolicy, enforced. Its own job because the tier 2 clusters run kind's
    # default network plugin, kindnet, which accepts a NetworkPolicy and enforces none of it --
    # a policy tested there passes whatever it says. This cluster runs Calico instead, and the
    # test refuses to run on a cluster without it rather than pass vacuously.
    name: NetworkPolicy -- enforced, on kind with Calico
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Cluster config without kindnet
        run: |
          cat > kind-calico.yaml <<'CONFIG'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
            podSubnet: 192.168.0.0/16
          CONFIG
      - name: Create cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: apchi
          config: kind-calico.yaml
          # No network plugin yet, so the node is not Ready until Calico is in.
          wait: 0s
      - name: Install Calico
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/calico.yaml
          kubectl -n kube-system rollout status ds/calico-node --timeout=600s
          kubectl wait --for=condition=ready node --all --timeout=300s

      - name: Deploy Trino
        run: |
          kubectl apply -f deploy/trino-dev/
          kubectl rollout status deploy/trino-coordinator --timeout=600s
          kubectl rollout status deploy/trino-worker --timeout=600s

      - name: NetworkPolicy -- against the enforcing cluster
        # Not APCHI_-prefixed: Apchi refuses to start with an APCHI_ variable it does not read,
        # and the test suite builds its Settings on import.
        env:
          REQUIRE_POLICY_ENFORCEMENT: "1"
        run: uv run pytest tests/network_policy -q -rs

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get networkpolicy -A
